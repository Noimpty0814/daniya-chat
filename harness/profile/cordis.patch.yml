# daniya profile patch
# 底：@deepseek-ai/dsh-sdk-minimal（完整显式树，不继承 dsh-base）
# 行 id 已逐条核对 packages/bundle/sdk-minimal/cordis.patch.yml @0.1.6-alpha.2。
# patch 语义（cordis-plugin-include applyEntryPatches）：
#   - 按 id 定位的行做浅层键覆盖（disabled/config/inject 等键整体替换，config 不深度合并）；
#   - name 是断言：与目标行插件名不一致时该 patch 被跳过并告警；
#   - 无 id 的 insert 列表追加到根条目末尾；匹配不到行的 patch 仅告警不失败；
#   - !!js 仅允许出现在 config 与 disabled 字段下，随条目激活按行内上下文求值。

# ── 移除：遥测上传、stdio JSON-RPC 通道与 dsh 自带启动面（由 daniya-bridge 接管）──
- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
  disabled: true            # bridge 独占 stdin/stdout 协议，不再挂 sdk-server
- id: sdk-app-startup
  name: '@deepseek-ai/dsh-sdk-app'
  disabled: true            # 其 EOF/启动语义由 bridge 复刻
- id: session-log-deepseek
  name: '@deepseek-ai/dsh-session-log-deepseek'
  disabled: true            # 隐私：随请求上传会话日志
- id: plugin-package-inventory-deepseek
  name: '@deepseek-ai/dsh-plugin-package-inventory-deepseek'
  disabled: true            # 隐私：插件清单上报；禁用后适配器完整性待验证

# ── 调整：沙箱收紧为 workspace-write，写入围栏在工作目录内（config 整组替换）──
- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: workspace-write             # danger-full-access → workspace-write
    workspaceRoot: !!js process.env.DANIYA_WORKDIR || process.cwd()

# ── 调整：LLM 走 chat-completions 协议 ──
# 适配器默认 protocol=messages（Anthropic 风格），而本应用 baseUrl 固定
# https://api.deepseek.com（OpenAI 兼容命名空间，/v1/messages 对该端点 404）。
# config 整组替换，须携带 bundle 原有的 apiKeyEnv/defaultContextWindow/streamIdleTimeoutMs。
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    protocol: chat-completions
    apiKeyEnv: DEEPSEEK_API_KEY
    defaultContextWindow: !!js Number(process.env.DSH_CONTEXT_WINDOW ?? 1000000)
    streamIdleTimeoutMs: 172800000

# ── 新增：bridge 插件、附件存储、联网工具、压缩与 token 计量 ──
- insert:
    - id: daniya-bridge
      name: 'daniya-bridge'           # 自研包，经 profile 依赖 file: 物化解析
      inject: [agents, sessions, systemPrompt, attachments]
      config:
        settingsFile: !!js process.env.DANIYA_SETTINGS_FILE
    - id: attachment-local
      name: '@deepseek-ai/dsh-attachment-local'
    - id: web
      name: '@deepseek-ai/dsh-web'
      config:
        searchProvider: deepseek-official
        fetchProvider: http
    - id: web-search-deepseek
      name: '@deepseek-ai/dsh-web-search-deepseek'
      config:
        apiKeyEnv: DEEPSEEK_API_KEY
    - id: web-fetch-http
      name: '@deepseek-ai/dsh-web-fetch-http'
    - id: tool-web
      name: '@deepseek-ai/dsh-tool-web'
      config:
        fetch: true
        searchTimeoutMs: 60000
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024
    - id: token-meter
      name: '@deepseek-ai/dsh-token-meter'
